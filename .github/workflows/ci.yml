name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + determinism + network tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages (native runner)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            guests/target
            runners/native/target
            tools/wasi-sdk
          key: ${{ runner.os }}-cargo-${{ hashFiles('guests/Cargo.lock', 'runners/native/Cargo.lock', 'scripts/fetch-wasi-sdk.sh') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: ABI conformance (spec/abi.json vs header, Rust bindings, runners)
        run: node scripts/gen-abi.mjs --check

      - name: Build games + native runner
        run: make

      - name: Fetch test ROMs
        run: make roms

      - name: Determinism (wasmtime JIT vs AOT vs V8)
        run: scripts/determinism-test.sh

      - name: Network lockstep (native <-> node via gasm-relay)
        run: scripts/net-test.sh

      - name: Asset providers
        run: LARGE_MB=50 scripts/asset-test.sh

      - name: "Unit tests (gasm-host: assets, keymap, net)"
        working-directory: runners/native
        run: cargo test --release --lib

      - name: Asset providers (file-backed, folders, case-insensitive; 200 MB streaming)
        run: scripts/asset-test.sh

      - name: OPFS + Worker mode in Chrome (csfs import, lazy reads, memory)
        run: |
          scripts/vendor-web.sh
          CHROME=$(command -v google-chrome || command -v chromium) node scripts/opfs-test.mjs 200

      - name: Parity (NES native vs wasm)
        run: make parity ROM=roms/cpu_instr_test.nes FRAMES=600

      - uses: actions/upload-artifact@v4
        with:
          name: games
          path: build/*.wasm

  # Same suites on the other desktop platforms: builds gasm-run natively and runs
  # the games built above. Proves the Windows/macOS runners are bit-identical.
  platforms:
    name: runner tests (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: games
          path: build

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            runners/native/target
          key: ${{ runner.os }}-runner-${{ hashFiles('runners/native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-runner-

      - name: Build native runner
        working-directory: runners/native
        run: cargo build --release

      - name: Fetch test ROMs
        run: scripts/fetch-roms.sh

      - name: Determinism (wasmtime JIT vs AOT vs V8)
        run: scripts/determinism-test.sh

      - name: Network lockstep (native <-> node via gasm-relay)
        run: scripts/net-test.sh

      - name: Asset providers
        run: LARGE_MB=50 scripts/asset-test.sh
