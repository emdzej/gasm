name: Release

# Push a version tag like 0.1.0 (no "v" prefix) to build runners for macOS/Linux/Windows, package them
# with the games (and macOS .app wrappers), and publish a GitHub Release.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a release for
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Third-party actions are pinned to commits (the tag in the comment).
jobs:
  # The full CI suite on the tagged commit: nothing is published unless it passes.
  ci:
    uses: ./.github/workflows/ci.yml

  games:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Build games
        run: make guests
      - name: License notices for the games (THIRD-PARTY.txt)
        run: scripts/third-party-notices.sh "$TAG" > build/THIRD-PARTY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: games
          path: |
            build/*.wasm
            build/THIRD-PARTY.txt
      # doom.wasm (GPL-2.0) and scummvm.wasm (GPL-3.0): their complete source goes out with every release
      - name: DOOM and ScummVM source
        run: |
          scripts/package-doom-src.sh "$TAG"
          scripts/package-scummvm-src.sh "$TAG"
      # SDL3 for gasm (libSDL3.a was built with the games)
      - name: SDL3 bundle
        run: scripts/package-sdl3.sh "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doom-src
          path: |
            dist/*-doom-src.tar.gz
            dist/*-scummvm-src.tar.gz
            dist/gasm-sdl3-*.zip

  # The source archives must rebuild the shipped GPL games byte for byte.
  rebuild-from-source:
    needs: games
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: games
          path: shipped
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: doom-src
          path: src
      - name: Rebuild doom.wasm and scummvm.wasm from their source archives
        run: |
          for g in doom scummvm; do
            mkdir -p "rebuild/$g" && tar xzf src/*-$g-src.tar.gz -C "rebuild/$g" --strip-components 1
            (cd "rebuild/$g" && scripts/fetch-wasi-sdk.sh >/dev/null && scripts/fetch-binaryen.sh >/dev/null && make "$g")
            cmp "rebuild/$g/build/$g.wasm" "shipped/$g.wasm" && echo "$g.wasm: identical"
          done

  native:
    needs: [ci, games, rebuild-from-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: macos-universal }
          # Linux binaries are built on 22.04 for its older glibc (they run on more
          # distributions); CI tests the same code on 24.04 x86_64 and arm64.
          - { os: ubuntu-22.04, platform: linux-x86_64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
          - { os: windows-2022, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: games
          path: build

      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        working-directory: runners/native
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../../dist/bin
          for b in gasm-run gasm-relay; do
            lipo -create -output ../../dist/bin/$b target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        working-directory: runners/native
        run: |
          cargo build --release
          mkdir -p ../../dist/bin
          cp target/release/gasm-run* target/release/gasm-relay* ../../dist/bin/ 2>/dev/null || true
          rm -f ../../dist/bin/*.d ../../dist/bin/*.pdb

      - name: Package
        run: |
          VERSION=$TAG
          PKG=$(scripts/package-cli.sh "$VERSION" "${{ matrix.platform }}" dist/bin)
          cd dist
          NAME=$(basename "$PKG")
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$NAME.zip" "$NAME" >/dev/null
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - name: macOS apps
        if: runner.os == 'macOS'
        run: |
          VERSION=$TAG
          scripts/package-macos.sh dist/bin/gasm-run "dist/gasm-$VERSION-macos-apps" "$VERSION"
          cd dist && ditto -c -k --keepParent "gasm-$VERSION-macos-apps" "gasm-$VERSION-macos-apps.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$TAG
          (cd artifacts/games && zip -q "../gasm-$VERSION-games-wasm.zip" *.wasm THIRD-PARTY.txt)
          cp "$(scripts/package-c-sdk.sh "$VERSION")" artifacts/
          cp spec/gasm.h spec/abi.json artifacts/
          mapfile -t FILES < <(find artifacts -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name gasm.h -o -name abi.json \))
          cat > notes.md <<NOTES
          ## Downloads

          | File | What |
          |---|---|
          | \`gasm-$VERSION-macos-apps.zip\` | **Sumo.app, NES.app, Triangle.app, Test Pattern.app**, double-click to play (unsigned: right-click, then Open the first time) |
          | \`gasm-$VERSION-macos-universal.tar.gz\` | gasm-run + gasm-relay (Apple Silicon + Intel) with games and launch scripts |
          | \`gasm-$VERSION-linux-x86_64.tar.gz\`, \`gasm-$VERSION-linux-arm64.tar.gz\` | same for Linux (x86_64, arm64) |
          | \`gasm-$VERSION-windows-x86_64.zip\` | same for Windows |
          | \`gasm-$VERSION-games-wasm.zip\` | just the games: the same .wasm files run on every runner and at https://gasm.emdzej.pl/demos/ (license notices in THIRD-PARTY.txt) |
          | \`gasm-$VERSION-scummvm-src.tar.gz\` | complete source of \`scummvm.wasm\` (GPL-3.0: the ScummVM files the build uses, the zlib/MP3/Vorbis/FLAC library sources, gasm's backend and configure patch); \`make scummvm\` rebuilds it byte for byte |
          | \`gasm-$VERSION-doom-src.tar.gz\` | complete source of \`doom.wasm\` (GPL-2.0: doomgeneric, chocolate-doom's OPL music, gasm's glue); \`make doom\` rebuilds it |
          | \`gasm-c-sdk-$VERSION.zip\` | C/C++ SDK: \`gasm.h\` + CMake toolchain (wasi-sdk) + examples (own main loop: \`gasm_loop.h\`) |
          | \`gasm-sdl3-$VERSION.zip\` | SDL 3 for gasm: \`libSDL3.a\`, headers, \`find_package(SDL3)\` config, examples (zlib license) |
          | \`gasm.h\`, \`abi.json\` | the ABI as a single C header, and machine-readable |

          Packages: [\`gasm-sdk\`](https://crates.io/crates/gasm-sdk) (write games in Rust) · [\`gasm-host\`](https://crates.io/crates/gasm-host) (native host library + \`cargo install gasm-host\` for gasm-run) · [\`@emdzej/gasm-host\`](https://www.npmjs.com/package/@emdzej/gasm-host) (browser/Node host) · \`ghcr.io/emdzej/gasm-relay\` (relay image)
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "gasm $VERSION" --notes-file notes.md --generate-notes
          fi

  # ---- registries: trusted publishing (OIDC), no long-lived tokens ----------------
  # One-time setup per package on the registry (see site/dev/testing.md#releases):
  # trusted publisher = repo emdzej/gasm, workflow release.yml, environment "release".
  publish-crates:
    needs: native
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: System packages (gasm-host verify build)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Set crate versions from the tag
        run: |
          sed -i "0,/^version = .*/s//version = \"$TAG\"/" guests/gasm/Cargo.toml runners/native/Cargo.toml runners/native/relay/Cargo.toml
          grep -m1 '^version' guests/gasm/Cargo.toml runners/native/Cargo.toml runners/native/relay/Cargo.toml
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - name: Publish gasm-sdk and gasm-host (skips versions already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          publish() { # <crate> <dir> [cargo args]
            if curl -sf -A "gasm-release (github.com/emdzej/gasm)" "https://crates.io/api/v1/crates/$1/$TAG" >/dev/null; then
              echo "$1 $TAG already published"; return
            fi
            (cd "$2" && cargo publish --allow-dirty "${@:3}")
          }
          publish gasm-sdk guests -p gasm-sdk
          publish gasm-host runners/native

  publish-npm:
    needs: native
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24          # npm >= 11.5.1: trusted publishing (OIDC) + automatic provenance
          registry-url: https://registry.npmjs.org
      - name: Publish @emdzej/gasm-host (skips versions already on npm)
        working-directory: runners/web
        # pnpm packs; npm uploads, because npm performs the OIDC token exchange
        # and attaches provenance (pnpm publish doesn't support trusted publishing).
        run: |
          pnpm --version && npm --version
          npm pkg set version="$TAG"
          if npm view "@emdzej/gasm-host@$TAG" version >/dev/null 2>&1; then
            echo "@emdzej/gasm-host@$TAG already published"
          else
            pnpm pack --pack-destination "$RUNNER_TEMP"
            npm publish "$RUNNER_TEMP"/emdzej-gasm-host-"$TAG".tgz --access public
          fi

  publish-relay-image:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-linux-*
          path: artifacts
      - name: Collect relay binaries
        run: |
          for a in x86_64:amd64 arm64:arm64; do
            tar xzf artifacts/package-linux-${a%%:*}/gasm-$TAG-linux-${a%%:*}.tar.gz -C artifacts
            cp artifacts/gasm-$TAG-linux-${a%%:*}/gasm-relay runners/native/relay-${a##*:}
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: runners/native
          file: runners/native/relay.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/emdzej/gasm-relay:${{ env.TAG }}
            ghcr.io/emdzej/gasm-relay:latest
          labels: |
            org.opencontainers.image.source=https://github.com/emdzej/gasm
            org.opencontainers.image.description=gasm-relay: WebSocket room relay for gasm games
            org.opencontainers.image.licenses=MIT
