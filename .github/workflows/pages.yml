name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated timestamps

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            guests/target
            tools/wasi-sdk
          key: pages-${{ hashFiles('guests/Cargo.lock', 'scripts/fetch-wasi-sdk.sh') }}
          restore-keys: pages-

      - name: Build games (wasm)
        run: make guests

      - name: Build site (VitePress + web runner at /play/)
        run: scripts/build-site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
