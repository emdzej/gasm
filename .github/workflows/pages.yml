name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # lastUpdated timestamps

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24          # JSPI: gasm_run guests (stack switching) in the Node runner
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            guests/target
          key: pages-${{ hashFiles('guests/Cargo.lock') }}
          restore-keys: pages-

      # toolchains and fetched sources (version-stamped: an older entry is re-fetched as needed)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tools/wasi-sdk
            tools/binaryen
            tools/SDL3-src
            tools/doom-src
            tools/scummvm-src
            tools/scummvm-libs
          key: ${{ runner.os }}-tools-${{ hashFiles('scripts/fetch-*.sh', 'scripts/build-scummvm-libs.sh', 'guests/doom/engine.patch', 'guests/scummvm/configure.patch') }}
          restore-keys: ${{ runner.os }}-tools-

      - name: Build games (wasm)
        run: make guests

      - name: Build site (VitePress + web runner at /play/)
        run: scripts/build-site.sh

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4