[package]
name = "gasm-host"
version = "0.2.0"
edition = "2024"
description = "Native host for gasm games (a portable game runtime on WebAssembly): wasmtime, WebGPU via wgpu, audio, gamepads, WebSocket networking and storage. Includes the gasm-run runner and gasm-relay"
license = "MIT"
repository = "https://github.com/emdzej/gasm"
homepage = "https://gasm.emdzej.pl"
documentation = "https://gasm.emdzej.pl/dev/runners"
readme = "README.md"
keywords = ["gamedev", "wasm", "wasmtime", "webgpu", "runtime"]
categories = ["game-development", "wasm", "emulators"]
rust-version = "1.85"

[lib]
name = "gasm_host"
path = "src/lib.rs"

[[bin]]
name = "gasm-run"
path = "src/main.rs"

[[bin]]
name = "gasm-relay"
path = "src/bin/gasm-relay.rs"

[dependencies]
wasmtime = "49"
wasmtime-wasi = "49"
winit = "0.30"
wgpu = "30"
pollster = "1"
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# TLS for wss:// (client) and gasm-relay --tls-cert (server); ring = no cmake/NASM needed
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
cpal = "0.18"
gilrs = "0.11"
png = "0.18"

[profile.release]
debug = false
