[package]
name = "gasm-host"
version = "0.10.0"
edition = "2024"
description = "Native host for gasm games (a portable game runtime on WebAssembly): wasmtime, WebGPU via wgpu, audio, gamepads, WebSocket networking and storage. Includes the gasm-run runner"
license = "MIT"
repository = "https://github.com/emdzej/gasm"
homepage = "https://gasm.emdzej.pl"
documentation = "https://gasm.emdzej.pl/dev/runners"
readme = "README.md"
keywords = ["gamedev", "wasm", "wasmtime", "webgpu", "runtime"]
categories = ["game-development", "wasm", "emulators"]
rust-version = "1.85"

[lib]
name = "gasm_host"
path = "src/lib.rs"

[[bin]]
name = "gasm-run"
path = "src/main.rs"

# gasm-relay is its own crate (relay/): it needs none of the runtime
[workspace]
members = ["relay"]
default-members = [".", "relay"]

[dev-dependencies]
# tests write small guests in the text format
wat = "1"

[features]
default = ["window"]
# the windowed runner: winit window, cpal audio, gilrs gamepads, keyboard layouts.
# Without it the library (and gasm-run) are headless only.
window = ["dep:winit", "dep:cpal", "dep:gilrs"]

[dependencies]
wasmtime = "49"
getrandom = "0.3"
winit = { version = "0.30", optional = true }
wgpu = "30"
pollster = "1"
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# TLS for wss:// (client) and gasm-relay --tls-cert (server); ring = no cmake/NASM needed
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# gasm:fetch: HTTP(S) on ring (as above), roots from the OS store
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "gzip"] }
rustls-native-certs = "0.8"
cpal = { version = "0.18", optional = true }
gilrs = { version = "0.11", optional = true }
png = "0.18"
# ANGLE (gasm:gl natively) is loaded at run time
libloading = "0.8"
# gasm:gl's model: fast hashing of runner-numbered handles (already in the tree via wasmtime)
rustc-hash = "2"

# the player's UTC offset (gasm.utc_offset_minutes): localtime_r / GetTimeZoneInformation
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time"] }

[profile.release]
debug = false
