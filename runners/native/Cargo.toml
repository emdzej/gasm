[package]
name = "gasm-run"
version = "0.1.0"
edition = "2024"
description = "gasm native runner (wasmtime + wgpu + winit + cpal + gilrs) and relay"
license = "MIT"

[dependencies]
wasmtime = "49"
wasmtime-wasi = "49"
winit = "0.30"
wgpu = "30"
pollster = "1"
serde_json = "1"
tungstenite = "0.30"
cpal = "0.18"
gilrs = "0.11"
png = "0.18"

[profile.release]
debug = false
