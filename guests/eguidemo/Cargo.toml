[package]
name = "eguidemo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "egui's demo on gasm:gl: egui_glow unchanged, on the gasm fork of glow"

[lib]
crate-type = ["cdylib"]

[dependencies]
gasm = { package = "gasm-sdk", path = "../gasm" }
glow = "0.17"
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.36", default-features = false }
egui_demo_lib = { version = "0.36", default-features = false }
