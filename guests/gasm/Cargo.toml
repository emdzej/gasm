[package]
name = "gasm-sdk"
version = "0.4.0"
edition.workspace = true
license.workspace = true
description = "Write games for gasm, a portable game runtime on WebAssembly: bindings for the gasm ABI (video, audio, input, WebGPU, network, storage) plus a Game trait"
repository = "https://github.com/emdzej/gasm"
homepage = "https://gasm.emdzej.pl"
documentation = "https://gasm.emdzej.pl/dev/games"
readme = "README.md"
keywords = ["gamedev", "wasm", "webassembly", "webgpu", "sdk"]
